<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B6E99">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Mantenimiento centrales</title>
<style>
:root{--bg:#F2F5F4;--ink:#14262B;--mute:#4F6469;--line:#C9D5D6;--card:#fff;--acc:#0B6E99;--acc-ink:#fff;--ok:#2E7D4F;--warn:#B25E00}
@media (prefers-color-scheme:dark){:root{--bg:#10191C;--ink:#E8F0F0;--mute:#9DB3B7;--line:#2C3E43;--card:#18262A;--acc:#4DB3E0;--acc-ink:#07161C;--ok:#6CC38A;--warn:#F0A04B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:var(--acc-ink);padding:12px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:19px;margin:0;flex:1}
header button{background:none;border:0;color:inherit;font-size:28px;line-height:1;padding:4px 10px;min-height:44px}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:6px;padding:18px 16px;margin:0 0 10px;font-size:18px;color:var(--ink);min-height:64px}
.item small{display:block;color:var(--mute);font-size:14px}
.field{margin:0 0 20px}
label{display:block;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:6px;padding:12px;min-height:48px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
textarea{min-height:96px}
.chk{display:flex;gap:12px;align-items:center;font-weight:600}
.chk input{width:28px;height:28px;min-height:0}
.hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:14px;color:var(--mute)}
.hist button{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:14px;color:var(--ink);min-height:36px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:56px;font-size:18px;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.seg button.on.bad{background:#C62828;border-color:#C62828;color:#fff}
input[readonly]{background:var(--bg);color:var(--mute)}
input.out{border-color:#C62828;background:#FDE7E7;color:#7A0000;font-weight:700}
.range{font-size:14px;color:var(--mute);margin-top:6px}
.range.out{color:#C62828;font-weight:700}
.range.out::after{content:" · FUERA DE RANGO"}
.hist button.badchip{border-color:#C62828;color:#C62828}
.err{display:none;color:#C62828;font-weight:700;font-size:14px;margin-top:6px}
.field.missing .err{display:block}
.field.missing input:not([type=checkbox]),.field.missing select,.field.missing textarea{border-color:#C62828}
.field.missing .seg button{border-color:#C62828}
.errbox{border-color:#C62828;color:#C62828;font-weight:700;background:#FDE7E7}
.danger{width:100%;margin-top:14px;background:none;color:#C62828;border:2px solid #C62828;border-radius:6px;padding:14px;font-size:17px;font-weight:700;min-height:52px}
@media (prefers-color-scheme:dark){.errbox{background:#3A1616;color:#FF8A80}.danger{color:#FF8A80;border-color:#FF8A80}}
.primary{width:100%;background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:16px;font-size:18px;font-weight:700;min-height:56px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;background:var(--card);border-top:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.bar button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:8px 14px;min-height:40px;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--ok)}
.dot.off{background:var(--warn)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px;color:var(--mute)}
</style>
</head>
<body>
<header><button id="back" aria-label="Volver" hidden>‹</button><h1 id="title">Centrales</h1></header>
<main id="app"></main>
<div class="bar"><span id="status"></span><button id="sync">Sincronizar</button></div>
<script src="jspdf.min.js"></script>
<script>
/* ============ CONFIGURACIÓN ============ */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyR-ic8SK2OPWvC3fD7bwdf6coGxYOsW_6YNI1cf2brrytUfgDwDO2tHScvv37SWdxi/exec",              // URL de la app web de Apps Script (ver LEEME)
  KEY: "DAORJE",    // misma clave que en Code.gs
  HISTORY_N: 5      // cuántas entregas anteriores mostrar
};

// TIPOS DE CAMPO:
//  datetime : fecha y hora automáticas (no se editan)
//  choice   : botones. "bad" = opciones que se marcan en rojo (opcional)
//  number   : valor con rango normal min/max; si se sale, se pone en rojo
//  text, textarea, select, check, date
// Todos los campos son OBLIGATORIOS salvo los que lleven optional:true
// "history:true" muestra lo respondido en entregas anteriores.
const BASE = [
  {id:"fecha", label:"Fecha y hora", type:"datetime"},
  {id:"grupo", label:"Estado del grupo", type:"choice", options:["Servicio","Paro"]},
  {id:"general", label:"Estado general", type:"choice", options:["Correcto","Incorrecto"], bad:["Incorrecto"]},
  {id:"temp_coj", label:"Temperatura cojinete", unit:"°C", type:"number", min:20, max:65, history:true},
  {id:"nivel_aceite", label:"Nivel de aceite", unit:"%", type:"number", min:40, max:80, history:true},
  {id:"presion", label:"Presión de agua", unit:"bar", type:"number", min:2, max:6, history:true},
  {id:"obs", label:"Observaciones", type:"textarea", optional:true}
];

  // ---------- SIVI D · CH SESUE (según el papel) ----------
const _OKI=["Correcto","Incorrecto"], _NOSI=["No","Si"];
const _sec=(c,t)=>({type:"section",code:c,label:c+" · "+t});
const _ok=l=>({label:l,type:"choice",options:_OKI,bad:["Incorrecto"]});   // Incorrecto = anomalía
const _an=l=>({label:l,type:"choice",options:_NOSI,bad:["Si"]});          // Si = anomalía
const _ch=(l,o)=>({label:l,type:"choice",options:o});                     // sin anomalía
const _rd=(l,u,min,max)=>({label:l,type:"number",unit:u,min,max,history:true});
const SIVI_D_RAW=[
 _sec("0002","EDIFICIO CENTRAL_GENERAL"), _ok("ESTADO PUERTA"),
 _sec("0004","EDIFICIO_INTERIOR"), _ok("ESTADO PUERTA"),
 _sec("0008","SALA DE MANDO_GENERAL"), _ok("TONO TELEFONO_974553120"),
 _sec("0009","SALA DE MANDO_ESTADO GRUPOS"),
   _ch("GRUPO 1",["Servicio","Descargo"]), _ch("GRUPO 1 DG1",["Marcha","Paro"]),
   _ch("GRUPO 2",["Servicio","Descargo"]), _ch("GRUPO 2 DG2",["Marcha","Paro"]),
 _sec("0010","SALA DE MANDO_MESA TERMINAL LOCAL"),
   _ok("ESTADO PC IDACS"), _ok("ALARMAS ACTIVAS"), _ok("COTA LINSOLES"), _ok("SAI"),
 _sec("0011","SALA CONTROL_CONTROL G2"), _rd("POTENCIA ACTIVA (PG2 DG2)"),
 _sec("0012","SALA CONTROL_CONTROL G1"), _rd("POTENCIA ACTIVA (PG1 DG1)"),
 _sec("0029","NAVE DESENCUBADO_ACCESO GENERAL"), _ok("ESTADO PUERTA"),
 _sec("0039","SALA MAQ_ALTER G2 SIST ALTER"), _ok("ESTADO GENERAL (DG2)"),
 _sec("0040","SALA MAQ_COJ GUIA ALTER G2"),
   _rd("TEMP COJ GUIA ALTER PG2","°C"), _ok("NIVEL ACEITE_COJ GUIA ALTER"),
   _an("ANOMALIA CONTENCION (ACEITE)"), _an("ANOMALIA CONTENCION (AGUA) DG2"),
 _sec("0041","SALA MAQ_COJ GUIA TURBINA G2"),
   _rd("TEMP COJ GUIA TURBINA G2 (DG2 PG2)","°C"), _ok("NIVEL ACEITE_COJ GUIA DG2"),
   _an("ANOMALIA CONTENCION (ACEITE)"), _an("ANOMALIA CONTENCION (AGUA)"),
 _sec("0058","SALA MAQ_COJ GUIA TURBINA G1"),
   _rd("TEMP COJ GUIA TURBINA (PG1 DG1)","°C"), _an("ANOMALIA CONTENCION (ACEITE)"),
 _sec("0078","SALA MAQ_BATERIAS 110V"), _ok("ESTADO GENERAL"),
 _sec("0080","BATERIA 2 125 V C.C._GENERAL"), _rd("TENSION 125 V C.C.","V",115,undefined),
 _sec("0083","SALA CUADRO RELES_GENERAL"), _ok("ESTADO SALA"),
 _sec("0111","RECINTO INF CELDAS_SALA BOMBAS DRENAJE"), _ok("ESTADO GENERAL"),
 _sec("0112","CDO POZO BOMBAS_GENERAL"), _ch("POSICION CONMUTADOR",["Automatico","Manual"]),
 _sec("0113","ACCESO PLANTA SOTANO _ G1 GENERAL"), _ok("ESTADO ESCALERA"),
 _sec("0119","PLANTA SOTANO_POZO DRENAJE"),
   _ok("ESTADO GENERAL BOYAS"), _ok("NIVEL AGUA"), _an("PRESENCIA NIVEL_ACEITE EN EL POZO"), _ok("ESTADO RECINTO"),
 _sec("0120","ACCESO PLANTA SOTANO _ G2 GENERAL"), _ok("ESTADO ESCALERA")
];
const SIVI_D=(()=>{
  let code="", n=0;
  const out=[{id:"fecha",label:"Fecha y hora de inicio",type:"datetime"},{id:"hora_fin",label:"Hora final",type:"endtime"}];
  SIVI_D_RAW.forEach(x=>{
    if(x.type==="section"){ code=x.code; n=0; out.push(Object.assign({id:"s"+code},x)); }
    else { n++; out.push(Object.assign({id:code+"_"+n},x)); }
  });
  out.push({id:"realizado",label:"Realizado por",type:"text",history:true});
  out.push({id:"total",label:"Total anomalías",type:"total"});
  return out;
})();
const FORMS = {
  sivi_a: { title: "SIVI A", fields: BASE },
  sivi_b: { title: "SIVI B", fields: BASE },
  sivi_c: { title: "SIVI C", fields: BASE },
  sivi_d: { title: "SIVI D", fields: SIVI_D }
};

// Centrales: cada una indica qué formularios tiene (por su identificador de FORMS).
const PLANTS = [
  {id:"central_1", name:"CH SALLENT",   forms:["sivi_a","sivi_b","sivi_c"]},
  {id:"central_2", name:"CH BAÑOS",     forms:["sivi_a","sivi_b","sivi_c"]},
  {id:"central_3", name:"CH LA SARRA",  forms:["sivi_a","sivi_b","sivi_c"]},
  {id:"central_4", name:"CH BIESCAS I", forms:["sivi_a","sivi_b","sivi_c"]},
  {id:"central_5", name:"CH SESUE",     forms:["sivi_a","sivi_b","sivi_c","sivi_d"]}
];
/* ====================================================== */

const $ = s => document.querySelector(s);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let view = {name:"home"};

function go(v){ view = v; render(); window.scrollTo(0,0); }
$("#back").onclick = () => go(view.name === "form" ? {name:"plant", plant:view.plant} : {name:"home"});

function render(){
  const app = $("#app"), back = $("#back");
  back.hidden = view.name === "home";
  if (view.name === "home"){
    $("#title").textContent = "Centrales";
    app.innerHTML = PLANTS.map(p => `<button class="item" data-p="${p.id}">${esc(p.name)}<small>${p.forms.length} formularios</small></button>`).join("");
    app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => go({name:"plant", plant:b.dataset.p}));
  } else if (view.name === "plant"){
    const p = PLANTS.find(x => x.id === view.plant);
    $("#title").textContent = p.name;
    app.innerHTML = p.forms.map(f => `<button class="item" data-f="${f}">${esc(FORMS[f].title)}${load("draft:"+p.id+":"+f,null) ? "<small>Borrador guardado</small>" : ""}</button>`).join("");
    app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => go({name:"form", plant:p.id, form:b.dataset.f}));
  } else renderForm();
}

function histOf(plant, form){ return load("hist", []).filter(h => h.plant===plant && h.form===form).sort((a,b)=>b.ts-a.ts).slice(0, CONFIG.HISTORY_N); }

const nowStr = () => { const d = new Date(), p = n => String(n).padStart(2,"0"); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const outOf = (fl, val) => {
  if (fl.type !== "number" || val === "" || val === undefined) return false;
  const n = parseFloat(String(val).replace(",", "."));
  if (isNaN(n)) return true;
  return (fl.min !== undefined && n < fl.min) || (fl.max !== undefined && n > fl.max);
};
const isBad = (fl, val) => fl.type === "choice" ? (fl.bad || []).includes(val) : outOf(fl, val);

function renderForm(){
  const p = PLANTS.find(x => x.id === view.plant), f = FORMS[view.form];
  $("#title").textContent = p.name + " · " + f.title;
  const dk = "draft:"+p.id+":"+view.form, draft = load(dk, {}), hist = histOf(p.id, view.form);
  let h = "";
  f.fields.forEach(fl => {
    const v = draft[fl.id] ?? "";
    const unit = fl.unit ? ` (${esc(fl.unit)})` : "";
    let input, hint = "";
    if (fl.type==="datetime") input = `<input id="f_${fl.id}" readonly value="${esc(v || nowStr())}">`;
    else if (fl.type==="choice") input = `<div class="seg" id="f_${fl.id}" data-v="${esc(v)}">${fl.options.map(o=>`<button type="button" data-o="${esc(o)}" class="${o===v?"on":""} ${o===v&&(fl.bad||[]).includes(o)?"bad":""}">${esc(o)}</button>`).join("")}</div>`;
    else if (fl.type==="check") { h += `<div class="field" id="w_${fl.id}"><label class="chk"><input type="checkbox" id="f_${fl.id}" ${v===true?"checked":""}>${esc(fl.label)}</label></div>`; return; }
    else if (fl.type==="textarea") input = `<textarea id="f_${fl.id}">${esc(v)}</textarea>`;
    else if (fl.type==="select") input = `<select id="f_${fl.id}"><option value="">Elegir…</option>${fl.options.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    else input = `<input id="f_${fl.id}" type="${fl.type==="number"?"text":fl.type}" ${fl.type==="number"?'inputmode="decimal"':""} value="${esc(v)}">`;
    if (fl.type==="number" && (fl.min!==undefined || fl.max!==undefined)) hint = `<div class="range" id="r_${fl.id}">Normal: ${fl.min ?? "…"} a ${fl.max ?? "…"} ${esc(fl.unit||"")}</div>`;
    let hs = "";
    if (fl.history){
      const vals = hist.map(e => e.data[fl.id]).filter(x => x !== undefined && x !== "");
      if (vals.length) hs = `<div class="hist"><span>Anteriores:</span>${vals.map(x=>`<button type="button" data-fill="${fl.id}" data-v="${esc(x)}" class="${outOf(fl,x)?"badchip":""}">${esc(x)}</button>`).join("")}</div>`;
    }
    h += `<div class="field" id="w_${fl.id}"><label for="f_${fl.id}">${esc(fl.label)}${unit}${fl.optional||fl.type==="datetime"?"":" *"}</label>${input}${hint}${hs}<div class="err">Obligatorio</div></div>`;
  });
  h += `<div class="msg errbox" id="errmsg" hidden></div><button class="primary" id="send">Guardar y enviar PDF</button><button class="danger" id="del">Borrar y empezar de nuevo</button>`;
  $("#app").innerHTML = h;

  const read = () => { const d = {}; f.fields.forEach(fl => { const el = $("#f_"+fl.id); d[fl.id] = fl.type==="check" ? el.checked : fl.type==="choice" ? el.dataset.v : el.value.trim(); }); return d; };
  const mark = fl => { // pinta en rojo los números fuera de rango
    const el = $("#f_"+fl.id), r = $("#r_"+fl.id), bad = outOf(fl, el.value.trim());
    el.classList.toggle("out", bad); if (r) { r.classList.toggle("out", bad); }
  };
  f.fields.filter(fl => fl.type==="number").forEach(fl => { mark(fl); $("#f_"+fl.id).addEventListener("input", () => mark(fl)); });
  $("#app").querySelectorAll("input,select,textarea").forEach(el => el.addEventListener("input", () => save(dk, read())));
  f.fields.filter(fl => fl.type==="choice").forEach(fl => {
    const box = $("#f_"+fl.id);
    box.querySelectorAll("button").forEach(b => b.onclick = () => {
      box.dataset.v = b.dataset.o;
      box.querySelectorAll("button").forEach(x => { const on = x === b; x.classList.toggle("on", on); x.classList.toggle("bad", on && (fl.bad||[]).includes(x.dataset.o)); });
      save(dk, read());
    });
  });
  $("#app").querySelectorAll("[data-fill]").forEach(b => b.onclick = () => { const el = $("#f_"+b.dataset.fill); el.value = b.dataset.v; el.dispatchEvent(new Event("input")); });
  const filled = (fl, v) => fl.type==="check" || fl.type==="datetime" ? true
    : fl.type==="number" ? (v !== "" && !isNaN(parseFloat(String(v).replace(",", "."))))
    : (v !== "" && v !== undefined);
  $("#app").querySelectorAll(".field").forEach(w => { const clear = () => w.classList.remove("missing"); w.addEventListener("input", clear); w.addEventListener("click", clear); });
  $("#send").onclick = () => {
    const d = read(), miss = f.fields.filter(fl => !fl.optional && !filled(fl, d[fl.id]));
    $("#app").querySelectorAll(".field").forEach(w => w.classList.remove("missing"));
    const box = $("#errmsg");
    if (miss.length){
      miss.forEach(fl => $("#w_"+fl.id).classList.add("missing"));
      box.hidden = false; box.textContent = miss.length === 1 ? "Falta 1 campo por rellenar. No se puede enviar." : `Faltan ${miss.length} campos por rellenar. No se puede enviar.`;
      $("#w_"+miss[0].id).scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    box.hidden = true;
    submit(p, view.form, f, d, dk);
  };
  $("#del").onclick = () => { if (confirm("¿Borrar todo lo rellenado en este formulario y empezar de nuevo?")){ localStorage.removeItem(dk); renderForm(); window.scrollTo(0,0); } };
}

function makePdf(p, f, data, when){
  const { jsPDF } = window.jspdf, doc = new jsPDF({unit:"mm", format:"a4"});
  let y = 20; const L = 18, W = 174;
  const need = n => { if (y + n > 280){ doc.addPage(); y = 20; } };
  doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text(p.name, L, y); y += 8;
  doc.setFontSize(13); doc.text(f.title, L, y); y += 6;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text("Enviado: " + when.toLocaleString("es-ES"), L, y); y += 4;
  doc.line(L, y, L+W, y); y += 8;
  f.fields.forEach(fl => {
    const raw = data[fl.id], bad = isBad(fl, raw);
    let val = fl.type==="check" ? (raw ? "Sí" : "No") : (raw || "—");
    if (fl.type==="number" && raw) val += (fl.unit ? " " + fl.unit : "");
    if (bad && fl.type==="number") val += "   (FUERA DE RANGO " + (fl.min ?? "…") + " - " + (fl.max ?? "…") + ")";
    if (bad && fl.type==="choice") val += "   (!)";
    const lines = doc.splitTextToSize(String(val), W);
    need(10 + lines.length*5);
    doc.setTextColor(0); doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.text(fl.label, L, y); y += 5;
    doc.setFont("helvetica", bad ? "bold" : "normal"); doc.setFontSize(11);
    if (bad) doc.setTextColor(200,0,0);
    doc.text(lines, L, y); doc.setTextColor(0); y += lines.length*5 + 4;
  });
  return doc.output("datauristring").split(",")[1];
}

function submit(p, formId, f, data, dk){
  const when = new Date(), id = when.getTime() + "-" + Math.random().toString(36).slice(2,6);
  const pad = n => String(n).padStart(2,"0");
  const stamp = `${when.getFullYear()}-${pad(when.getMonth()+1)}-${pad(when.getDate())}_${pad(when.getHours())}${pad(when.getMinutes())}`;
  let pdf;
  try { pdf = makePdf(p, f, data, when); } catch(e){ alert("No se pudo crear el PDF: " + e.message); return; }
  const q = load("queue", []);
  q.push({id, plantName:p.name, formTitle:f.title, filename:`${p.name}_${f.title}_${stamp}.pdf`.replace(/[\\/:*?"<>|]/g,"-"), pdf, plant:p.id, form:formId, ts:when.getTime(), data});
  save("queue", q);
  const hist = load("hist", []); hist.push({id, plant:p.id, form:formId, ts:when.getTime(), data}); save("hist", hist.slice(-400));
  localStorage.removeItem(dk);
  go({name:"plant", plant:p.id});
  status(); flush();
}

let syncing = false;
async function flush(){
  if (syncing || !CONFIG.SCRIPT_URL || !navigator.onLine) return;
  syncing = true; status();
  try {
    for (const item of load("queue", [])){
      const r = await fetch(CONFIG.SCRIPT_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({key:CONFIG.KEY, plantName:item.plantName, formTitle:item.formTitle, filename:item.filename, pdf:item.pdf, id:item.id, plant:item.plant, form:item.form, ts:item.ts, data:item.data})});
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "Error del servidor");
      save("queue", load("queue", []).filter(x => x.id !== item.id));
      status();
    }
    const r = await fetch(CONFIG.SCRIPT_URL + "?key=" + encodeURIComponent(CONFIG.KEY) + "&n=300");
    const j = await r.json();
    if (j.ok){
      const have = new Set(load("hist", []).map(h => h.id));
      const merged = load("hist", []).concat(j.entries.filter(e => !have.has(e.id)));
      save("hist", merged.sort((a,b)=>a.ts-b.ts).slice(-400));
    }
  } catch(e){ console.warn("Sincronización pendiente:", e.message); }
  syncing = false; status();
  if (view.name === "plant" || view.name === "home") render();
}

function status(){
  const n = load("queue", []).length, on = navigator.onLine;
  $("#status").innerHTML = `<span class="dot ${on?"":"off"}"></span>${on?"Con cobertura":"Sin cobertura"}${n?` · ${n} PDF pendiente${n>1?"s":""}`:""}${!CONFIG.SCRIPT_URL?" · Drive sin configurar":""}`;
}
$("#sync").onclick = flush;
addEventListener("online", () => { status(); flush(); });
addEventListener("offline", status);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
render(); status(); flush();
</script>
</body>
</html>
